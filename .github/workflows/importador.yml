# Importador de Market Intelligence en GitHub Actions (sin servidor propio).
#
# · Cada noche: actualiza toda Galicia (clubes del RED y comercios de OpenStreetMap)
#   y procesa cualquier importación pendiente.
# · Cada domingo: actualiza los comercios de OpenStreetMap de toda España (52 provincias) y los clubes
#   de los registros autonómicos en abierto (Cataluña, País Vasco, Navarra y Canarias).
# · Bajo demanda: la web lo lanza al pedir una importación (si tiene GITHUB_DISPATCH_TOKEN),
#   o se lanza a mano desde la pestaña Actions → «Importador» → «Run workflow»
#   (en «Ámbito de OpenStreetMap» se puede escribir espana, una comunidad como andalucia, o un código de provincia).
#
# Secreto necesario en el repositorio: DATABASE_URL (cadena «Session pooler» de Supabase).
name: Importador

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC (05:17 en Madrid en horario de verano)
    - cron: "41 0 * * 0" # domingos 00:41 UTC: toda España en OpenStreetMap
  workflow_dispatch:
    inputs:
      refresco_completo:
        description: "Además de la cola, actualizar toda Galicia"
        type: boolean
        default: false
      clubes_registros:
        description: "Actualizar los clubes de los registros autonómicos (Cataluña, País Vasco, Navarra, Canarias)"
        type: boolean
        default: false
      ambito_osm:
        description: "Ámbito de OpenStreetMap (espana, una comunidad como andalucia o madrid, o un código de provincia). Vacío = nada"
        type: string
        default: ""

# Nunca dos ejecuciones a la vez: la siguiente espera a que termine la anterior.
concurrency:
  group: importador
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    # Toda España tarda varias horas. Si se corta, lo pendiente se retoma en la siguiente ejecución.
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONTACT: https://github.com/thedesignerux-lgtm/Market-Intelligence-
      CACHE_DIR: .cache
      WORKER_ID: github-actions-${{ github.run_id }}
      # Si una fuente cambia de dirección, se sustituye aquí sin desplegar:
      # Settings → Secrets and variables → Actions → Variables. Vacías = valor por defecto.
      RED_CSV_URL: ${{ vars.RED_CSV_URL }}
      OSM_EXTRACT_BASE_URL: ${{ vars.OSM_EXTRACT_BASE_URL }}
      CARTOCIUDAD_URL: ${{ vars.CARTOCIUDAD_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Comprobar configuración
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Instalar osmium (procesa los extractos de OpenStreetMap)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Procesar las importaciones pedidas desde la web
        run: npm run -s worker -- --once

      - name: Actualizar toda Galicia
        if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') || inputs.refresco_completo
        run: |
          # Si ya hay una importación igual en curso, se sigue con la siguiente.
          npm run -s import -- red_galicia galicia || echo "::warning::No se pudo lanzar la actualización de clubes"
          npm run -s import -- osm galicia || echo "::warning::No se pudo lanzar la actualización de comercios"
          npm run -s worker -- --once

      - name: Comercios de OpenStreetMap en el ámbito pedido (o toda España los domingos)
        if: ${{ !cancelled() && ((github.event_name == 'schedule' && github.event.schedule == '41 0 * * 0') || inputs.ambito_osm != '') }}
        env:
          AMBITO: ${{ inputs.ambito_osm || 'espana' }}
        run: npm run -s import -- osm "$AMBITO"

      - name: Clubes de los registros autonómicos (o todos los domingos)
        if: ${{ !cancelled() && ((github.event_name == 'schedule' && github.event.schedule == '41 0 * * 0') || inputs.clubes_registros) }}
        run: npm run -s import -- clubes espana
